# The web mirror: the same Flutter web build GitHub Pages serves, under the
# same /nukhbaa/ path, so one build fits both hosts. See Dockerfile.

# Brotli without a brotli module (stock nginx): the deploy workflow writes a
# .br copy beside the files a first visit waits for
# (finalize_build.mjs compress). A browser that accepts br is sent that
# copy, about a quarter smaller than gzip; any other gets the gzip below.
map $http_accept_encoding $nk_accepts_br {
    default 0;
    "~*\bbr\b" 1;
}

# The .br copy to send, or "": only the files finalize_build.mjs compresses.
map "$nk_accepts_br:$uri" $nk_br_copy {
    default "";
    "~^1:(?<nk_br_path>/nukhbaa/(main\.dart\.[0-9a-f]{12}\.js|canvaskit-[0-9a-f]{12}/(chromium/)?canvaskit\.(js|wasm)|assets/(assets/)?fonts/[^/]+\.(ttf|otf)))$" "$nk_br_path.br";
}

# A .br copy keeps the cache rule of the file it copies (see below).
map $uri $nk_br_cache {
    default "public, max-age=31536000, immutable";
    "~^/nukhbaa/assets/" "public, max-age=2592000";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Northflank terminates TLS in front of this container, so a redirect
    # must stay relative; an absolute one would point at http://...:8080.
    absolute_redirect off;

    # Security headers (audit NUKHBA-005, script 100), repeated in every
    # location below: a location with an add_header of its own drops the
    # server block's. No sniffing of types, no framing by another site, no
    # full address sent to other sites. No script policy yet: CanvasKit,
    # Firebase and Sentry need one tested on the web first.

    # The first visit downloads main.dart.js and canvaskit.wasm (about 10 MB
    # raw); compressed they are a fraction of that on a slow connection.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript
               application/json application/manifest+json application/wasm
               application/octet-stream image/svg+xml;

    # The .br copies: reached only through the rewrites below (internal),
    # sent as they are (gzip off), with the type of the file they copy.
    # The first regex location, so a .br name never falls into the ones
    # after it.
    location ~ ^/nukhbaa/.+\.br$ {
        internal;
        gzip off;
        types { }
        default_type application/octet-stream;
        add_header Content-Encoding br always;
        add_header Vary Accept-Encoding always;
        add_header Cache-Control $nk_br_cache always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;

        location ~ \.wasm\.br$ {
            internal;
            default_type application/wasm;
        }
        location ~ \.js\.br$ {
            internal;
            default_type text/javascript;
        }
        location ~ \.ttf\.br$ {
            internal;
            default_type font/ttf;
        }
        location ~ \.otf\.br$ {
            internal;
            default_type font/otf;
        }
    }

    # Named by their content (finalize_build.mjs version): a build that
    # changes them gives them new names, so a returning visitor's browser
    # keeps them a year and never asks again. =404, never the app page: an
    # old name must not be kept a year as HTML.
    location ~ "^/nukhbaa/(main\.dart\.[0-9a-f]{12}\.js|canvaskit-[0-9a-f]{12}/.+)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        if ($nk_br_copy) {
            rewrite ^ $nk_br_copy last;
        }
        try_files $uri =404;
    }

    # The fonts keep their names between builds and change so rarely that
    # a month without asking is safe.
    location ~ ^/nukhbaa/assets/(assets/)?fonts/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        if ($nk_br_copy) {
            rewrite ^ $nk_br_copy last;
        }
        try_files $uri =404;
    }

    # The app's pictures (the team crests above all, dozens on one page):
    # kept a week, so a return from the home screen no longer asks for each
    # one again over a slow network (audit L-54, batch 147). A replaced
    # picture keeps its name, so it may take up to a week to show.
    location ~ "^/nukhbaa/assets/assets/.+\.(png|webp|jpg|jpeg)$" {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        try_files $uri =404;
    }

    # The landing page (deploy/web-mirror/landing): favicon, og:image and
    # the APK download button live at the site root; the app stays under
    # /nukhbaa/.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        try_files $uri $uri/ =404;
    }

    # no-cache: the browser keeps its copy but asks every time whether it
    # changed (a 304 when it has not). These names never change between
    # builds (index.html, flutter_bootstrap.js), so a max-age kept serving
    # the previous build after a deploy (batch 72); they are what carries
    # the new content names above to a returning visitor.
    location /nukhbaa/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        try_files $uri $uri/ /nukhbaa/index.html;
    }
}
