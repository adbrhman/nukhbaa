# Weekly encrypted backup of the Supabase database (the Free plan has none),
# every Tuesday 01:30 UTC -- weekly keeps the dump inside the Free plan
# egress quota as the database grows. Run it by hand before risky changes.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL    Session pooler connection string (IPv4), port 5432:
#                      postgresql://postgres.<ref>:<password>@<host>:5432/postgres
#   BACKUP_PASSPHRASE  Long random passphrase. Without it the backup cannot be
#                      decrypted -- store it somewhere safe outside GitHub.
#
# The repository is public, so nothing is committed: the dump is encrypted
# (AES-256) and kept as a workflow artifact for 90 days.
#
# Restore (on a trusted machine):
#   gpg --decrypt nukhbaa-db-<stamp>.tar.gz.gpg > backup.tar.gz
#   tar -xzf backup.tar.gz
#   then follow "Backup and Restore using the CLI" in the Supabase docs
#   (roles.sql, schema.sql, data.sql, auth_data.sql).
name: db-backup

on:
  schedule:
    - cron: '30 1 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  # Needed only to re-enable this workflow (see the first step).
  actions: write

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      # Warn well before the Free plan's 500 MB database limit.
      SIZE_WARN_MB: '400'
    steps:
      # GitHub disables scheduled workflows in a public repository after 60
      # days without repository activity -- exactly when nobody is
      # watching. Re-enabling this workflow on every run keeps the weekly
      # backup alive. Never fails the backup.
      - name: Keep this schedule enabled
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/db-backup.yml/enable"

      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::SUPABASE_DB_URL and BACKUP_PASSPHRASE secrets are required"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump roles, schema and data
        run: |
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --data-only --use-copy
          # Accounts live in Supabase Auth; identity.users references them.
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/auth_data.sql --data-only --use-copy --schema auth
          ls -la backup
          for f in roles schema data auth_data; do
            test -s "backup/$f.sql" || { echo "::error::backup/$f.sql is empty"; exit 1; }
          done

      - name: Encrypt
        run: |
          STAMP="$(date -u +%Y%m%d-%H%M)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          tar -czf "nukhbaa-db-$STAMP.tar.gz" backup
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 \
            -o "nukhbaa-db-$STAMP.tar.gz.gpg" "nukhbaa-db-$STAMP.tar.gz"
          rm -rf backup "nukhbaa-db-$STAMP.tar.gz"
          ls -la "nukhbaa-db-$STAMP.tar.gz.gpg"

      - uses: actions/upload-artifact@v4
        with:
          name: nukhbaa-db-${{ env.STAMP }}
          path: nukhbaa-db-${{ env.STAMP }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error

      # Runs after the upload, so a size alarm never costs the backup itself.
      # A failed scheduled run emails the workflow owner.
      - name: Database size check
        run: |
          BYTES="$(docker run --rm postgres:17-alpine psql "$SUPABASE_DB_URL" -tAc 'select pg_database_size(current_database())')"
          MB=$(( BYTES / 1024 / 1024 ))
          echo "Database size: ${MB} MB"
          echo "Database size: **${MB} MB** (warn at ${SIZE_WARN_MB} MB of 500 MB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MB" -ge "$SIZE_WARN_MB" ]; then
            echo "::error::Database is ${MB} MB -- approaching the 500 MB Free plan limit"
            exit 1
          fi
