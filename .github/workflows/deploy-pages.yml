name: Deploy Web to GitHub Pages

on:
  # Deploy ONLY after Build Verification has actually passed on main.
  # Previously this ran in parallel with the gate, so a red test suite still
  # published to the live site as long as flutter build web compiled.
  workflow_run:
    workflows: ["Build Verification"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Read pinned Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Ensure web platform folder exists
        working-directory: apps/mobile
        run: flutter create --platforms=web . --project-name mobile

      - name: Restore committed web assets
        run: git checkout -- apps/mobile/web

      - name: Generate code (build_runner)
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        working-directory: apps/mobile
        run: >-
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=NUKHBA_API_BASE_URL=${{ vars.NUKHBA_API_BASE_URL || 'https://api.nukhba.example' }}

      - name: SPA fallback
        run: cp apps/mobile/build/web/index.html apps/mobile/build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
