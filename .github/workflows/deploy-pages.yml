name: Deploy Web to GitHub Pages

on:
  # Deploy ONLY after Build Verification has actually passed on main.
  # Previously this ran in parallel with the gate, so a red test suite still
  # published to the live site as long as flutter build web compiled.
  workflow_run:
    workflows: ["Build Verification"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  # write: the last step force-pushes the build to the web-dist branch.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Read pinned Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Ensure web platform folder exists
        working-directory: apps/mobile
        run: flutter create --platforms=web . --project-name mobile

      - name: Restore committed web assets
        run: git checkout -- apps/mobile/web

      - name: Install NUKHBAA web icon
        run: |
          set -euo pipefail
          cp apps/mobile/assets/branding/nukhbaa_icon_v7/icon192.png apps/mobile/web/icons/Icon-192.png
          cp apps/mobile/assets/branding/nukhbaa_icon_v7/icon512.png apps/mobile/web/icons/Icon-512.png
          cp apps/mobile/assets/branding/nukhbaa_icon_v7/icon192.png apps/mobile/web/icons/Icon-maskable-192.png
          cp apps/mobile/assets/branding/nukhbaa_icon_v7/icon512.png apps/mobile/web/icons/Icon-maskable-512.png
          cp apps/mobile/assets/branding/nukhbaa_icon_v7/favicon.png apps/mobile/web/favicon.png
          echo "NUKHBAA web icon installed"

      - name: Generate code (build_runner)
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Require API base URL
        run: |
          if [ -z "${{ vars.NUKHBA_API_BASE_URL }}" ]; then
            echo "::error::NUKHBA_API_BASE_URL repository variable is not set. Refusing to publish a build pointing at a placeholder API."
            exit 1
          fi

      # --no-web-resources-cdn: CanvasKit is served from this site, not
      # www.gstatic.com. Some networks block Google's CDN, and without
      # CanvasKit the page stays blank (it opened only over a VPN).
      - name: Build web
        working-directory: apps/mobile
        run: >-
          flutter build web --release
          --no-web-resources-cdn
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=NUKHBA_API_BASE_URL=${{ vars.NUKHBA_API_BASE_URL }}
          --dart-define=NUKHBA_SENTRY_DSN=${{ vars.NUKHBA_SENTRY_DSN }}
          --dart-define=NUKHBA_INVITE_BASE_URL=${{ vars.NUKHBA_INVITE_BASE_URL }}
          --dart-define=NUKHBA_BUILD_SHA=$(git rev-parse HEAD | cut -c1-7)

      - name: SPA fallback
        run: cp apps/mobile/build/web/index.html apps/mobile/build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # github.io is blocked in Yemen; Northflank's code.run is not. A second
      # free Northflank service builds the web-dist branch with
      # deploy/web-mirror/Dockerfile (nginx, same build, same /nukhbaa/
      # path). One orphan commit, force-pushed, so the 20+ MB build never
      # piles up in the repository's history.
      - name: Publish the build to the web-dist branch (Northflank mirror)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          DIST="$RUNNER_TEMP/web-dist"
          rm -rf "$DIST"
          mkdir -p "$DIST/site"
          cp -R apps/mobile/build/web "$DIST/site/nukhbaa"
          cp deploy/web-mirror/Dockerfile deploy/web-mirror/nginx.conf "$DIST/"
          cd "$DIST"
          git init -q
          git checkout -q -b web-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile nginx.conf site
          git commit -q -m "web build $SHORT_SHA"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" web-dist
          echo "web-dist now holds the build of $SHORT_SHA"
