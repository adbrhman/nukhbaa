name: Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-verification-${{ github.ref }}
  cancel-in-progress: true

env:
  API_BASE_URL: ${{ vars.NUKHBA_API_BASE_URL || 'https://api.nukhba.example' }}

jobs:
  database_migrations:
    name: Migrations (clean database)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # A renamed or emptied migration directory must fail loudly rather than
      # "pass" by applying nothing at all.
      - name: Verify the migration set is present
        shell: bash
        run: |
          set -euo pipefail
          count=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)
          echo "migrations found: $count"
          test "$count" -ge 27 || {
            echo "::error::expected at least 27 migrations, found $count"
            exit 1
          }

      # The full local stack, not a bare Postgres: 0001 references auth.users
      # and 0026 references storage.buckets/storage.objects, so gotrue and
      # storage-api must have created their schemas first.
      - name: Start a clean local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/config.toml || supabase init < /dev/null
          supabase start

      # Recreates the database and applies EVERY file in supabase/migrations
      # in order. This is the check CI never had: a SQL error, a bad RLS
      # policy or a mis-ordered migration now fails the build.
      - name: Apply every migration to the clean database
        run: supabase db reset --no-seed

      - name: Show applied migration history
        run: supabase migration list --local

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

  workspace:
    name: Analyze + Test (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Generate code (build_runner, mobile)
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (workspace, fatal warnings)
        run: dart analyze --fatal-warnings .

      - name: Verify formatting (workspace)
        run: dart format --output=none --set-exit-if-changed .

      - name: Import-lint (Clean Architecture boundaries)
        run: dart run tooling/import_lint/bin/import_lint.dart

      # Single source of truth: the Melos scripts in the root pubspec.yaml.
      # The previous hand-maintained package list silently EXCLUDED
      # packages/api_client (5 test files, the entire HTTP transport layer),
      # so "CI green" did not mean "melos run test green". Any future package
      # is now picked up automatically via packageFilters: dirExists: test.
      - name: Test — all Dart packages (melos)
        run: dart run melos run test

      - name: Test — apps/mobile (flutter, with coverage)
        working-directory: apps/mobile
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/mobile/coverage/lcov.info
          retention-days: 14

  build_web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: workspace
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Ensure platform folders exist
        working-directory: apps/mobile
        run: flutter create --platforms=web . --project-name mobile

      - name: Restore committed web assets
        run: git checkout -- apps/mobile/web

      - name: Generate code (build_runner)
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        working-directory: apps/mobile
        run: |
          CLEAN_API_BASE_URL=$(printf '%s' "$API_BASE_URL" | tr -d '\r\n')
          echo "{\"NUKHBA_API_BASE_URL\":\"$CLEAN_API_BASE_URL\"}" > /tmp/dart_defines.json
          flutter build web --dart-define-from-file=/tmp/dart_defines.json --release

      - uses: actions/upload-artifact@v4
        with:
          name: nukhba-web
          path: apps/mobile/build/web
          retention-days: 14

  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: workspace
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Read pinned Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Ensure platform folders exist
        working-directory: apps/mobile
        run: flutter create --platforms=android . --project-name mobile

      - name: Apply NUKHBAA launcher icon
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable
          cp web/icons/Icon-512.png android/app/src/main/res/drawable/nukhbaa_launcher.png
          python3 - <<'PYEOF'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          text, count = re.subn(
              r'android:icon="@mipmap/ic_launcher"',
              'android:icon="@drawable/nukhbaa_launcher"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("ERROR: generated launcher icon reference not found exactly once")
          text = re.sub(
              r'android:roundIcon="@mipmap/ic_launcher_round"',
              'android:roundIcon="@drawable/nukhbaa_launcher"',
              text,
              count=1,
          )
          manifest.write_text(text, encoding="utf-8")
          print("NUKHBAA launcher icon applied")
          PYEOF

      - name: Decode release keystore
        working-directory: apps/mobile
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -dc 'A-Za-z0-9+/=' > /tmp/keystore.b64
          echo "طول النص بعد التنظيف: $(wc -c < /tmp/keystore.b64) حرف"
          base64 -d /tmp/keystore.b64 > android/app/keystore.jks
          test -s android/app/keystore.jks || { echo "::error::فشل فك الترميز — القيمة المخزّنة في السر تالفة أو غير صالحة"; exit 1; }

      - name: Write key.properties
        working-directory: apps/mobile
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: Inject release signing config (idempotent)
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re, os

          gk = "android/app/build.gradle.kts"
          gg = "android/app/build.gradle"

          if os.path.exists(gk):
              path = gk
              s = open(path, encoding="utf-8").read()

              if "keystoreProperties" not in s:
                  header = (
                      'import java.util.Properties\n'
                      'import java.io.FileInputStream\n\n'
                  )
                  s = header + s

                  props_block = (
                      '\nval keystoreProperties = Properties()\n'
                      'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                      'if (keystorePropertiesFile.exists()) {\n'
                      '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                      '}\n\n'
                  )
                  s = re.sub(r"(\nandroid\s*\{)", props_block + r"\1", s, count=1)

              if 'create("release")' not in s or "signingConfigs" not in s:
                  signing_configs = (
                      '    signingConfigs {\n'
                      '        create("release") {\n'
                      '            keyAlias = keystoreProperties["keyAlias"] as String\n'
                      '            keyPassword = keystoreProperties["keyPassword"] as String\n'
                      '            storeFile = file(keystoreProperties["storeFile"] as String)\n'
                      '            storePassword = keystoreProperties["storePassword"] as String\n'
                      '        }\n'
                      '    }\n\n'
                  )
                  s = re.sub(r"(\n    buildTypes\s*\{)", "\n" + signing_configs + r"    buildTypes {", s, count=1)

              s = re.sub(
                  r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                  'signingConfig = signingConfigs.getByName("release")',
                  s)

              open(path, "w", encoding="utf-8").write(s)
              print("signing config injected into build.gradle.kts")

          elif os.path.exists(gg):
              path = gg
              s = open(path, encoding="utf-8").read()

              if "keystoreProperties" not in s:
                  header = (
                      'import java.util.Properties\n\n'
                      'def keystoreProperties = new Properties()\n'
                      'def keystorePropertiesFile = rootProject.file("key.properties")\n'
                      'if (keystorePropertiesFile.exists()) {\n'
                      '    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n'
                      '}\n\n'
                  )
                  s = header + s

              if "signingConfigs {" not in s:
                  signing_configs = (
                      '    signingConfigs {\n'
                      '        release {\n'
                      '            keyAlias keystoreProperties["keyAlias"]\n'
                      '            keyPassword keystoreProperties["keyPassword"]\n'
                      '            storeFile file(keystoreProperties["storeFile"])\n'
                      '            storePassword keystoreProperties["storePassword"]\n'
                      '        }\n'
                      '    }\n\n'
                  )
                  s = re.sub(r"(\n    buildTypes\s*\{)", "\n" + signing_configs + r"    buildTypes {", s, count=1)

              s = re.sub(
                  r'signingConfig\s+signingConfigs\.debug',
                  'signingConfig signingConfigs.release',
                  s)

              open(path, "w", encoding="utf-8").write(s)
              print("signing config injected into build.gradle")

          else:
              raise SystemExit("ERROR: no android/app/build.gradle(.kts) after flutter create")
          PYEOF

      - name: Ensure INTERNET permission
        working-directory: apps/mobile
        run: sed -i "/<manifest /a\\    <uses-permission android:name=\"android.permission.INTERNET\" />" android/app/src/main/AndroidManifest.xml

      # `flutter create --project-name mobile` derives android:label from the
      # pub package name, so every build shipped a launcher icon captioned
      # "mobile". The package name cannot change (every
      # `import 'package:mobile/...'` depends on it) and android/ is generated
      # per build rather than committed, so the label is set here -- alongside
      # the permission and ota_update edits, which patch the same generated
      # manifest for the same reason. web/manifest.json and web/index.html
      # already carry the product name; this brings Android in line.
      - name: Set the launcher label
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re, sys

          manifest = "android/app/src/main/AndroidManifest.xml"
          s = open(manifest, encoding="utf-8").read()
          s, n = re.subn(r'android:label="mobile"', 'android:label="\u0646\u064f\u062e\u0628\u0629"', s, count=1)
          if n != 1:
              sys.exit("ERROR: android:label=\"mobile\" not found in the generated manifest")
          open(manifest, "w", encoding="utf-8").write(s)
          print("launcher label set")
          PYEOF

      - name: Inject ota_update Android requirements (idempotent)
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re, os

          manifest = "android/app/src/main/AndroidManifest.xml"
          s = open(manifest, encoding="utf-8").read()

          # 1) REQUEST_INSTALL_PACKAGES permission (needed for external-APK install).
          if "REQUEST_INSTALL_PACKAGES" not in s:
              s = re.sub(
                  r"(<manifest[^>]*>)",
                  r'\1\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />',
                  s, count=1)

          # 2) FileProvider + InstallResultReceiver inside <application>.
          if "sk.fourq.otaupdate.OtaUpdateFileProvider" not in s:
              block = (
                  '        <provider\n'
                  '            android:name="sk.fourq.otaupdate.OtaUpdateFileProvider"\n'
                  '            android:authorities="${applicationId}.ota_update_provider"\n'
                  '            android:exported="false"\n'
                  '            android:grantUriPermissions="true">\n'
                  '            <meta-data\n'
                  '                android:name="android.support.FILE_PROVIDER_PATHS"\n'
                  '                android:resource="@xml/filepaths" />\n'
                  '        </provider>\n'
                  '        <receiver android:name="sk.fourq.otaupdate.InstallResultReceiver" android:exported="false">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="${applicationId}.ACTION_INSTALL_COMPLETE"/>\n'
                  '            </intent-filter>\n'
                  '        </receiver>\n'
              )
              s = s.replace("    </application>", block + "    </application>", 1)

          open(manifest, "w", encoding="utf-8").write(s)

          # 3) filepaths.xml consumed by the FileProvider.
          os.makedirs("android/app/src/main/res/xml", exist_ok=True)
          open("android/app/src/main/res/xml/filepaths.xml", "w", encoding="utf-8").write(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<paths xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <files-path name="internal_apk_storage" path="ota_update/"/>\n'
              '</paths>\n')

          # 4) Java 8 core-library desugaring in app/build.gradle(.kts) — required
          #    by ota_update 7.x. AGP for Flutter 3.44 is 8.x => desugar_jdk_libs 2.0.3.
          gk = "android/app/build.gradle.kts"
          gg = "android/app/build.gradle"
          if os.path.exists(gk):
              g = open(gk, encoding="utf-8").read()
              if "coreLibraryDesugaringEnabled" not in g:
                  g = re.sub(r"(compileOptions\s*\{)",
                             r"\1\n        isCoreLibraryDesugaringEnabled = true",
                             g, count=1)
              if "desugar_jdk_libs" not in g:
                  if re.search(r"\ndependencies\s*\{", g):
                      g = re.sub(r"(\ndependencies\s*\{)",
                                 r'\1\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                                 g, count=1)
                  else:
                      g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              open(gk, "w", encoding="utf-8").write(g)
              print("  desugaring injected into build.gradle.kts")
          elif os.path.exists(gg):
              g = open(gg, encoding="utf-8").read()
              if "coreLibraryDesugaringEnabled" not in g:
                  g = re.sub(r"(compileOptions\s*\{)",
                             r"\1\n        coreLibraryDesugaringEnabled true",
                             g, count=1)
              if "desugar_jdk_libs" not in g:
                  if re.search(r"\ndependencies\s*\{", g):
                      g = re.sub(r"(\ndependencies\s*\{)",
                                 r"\1\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
                                 g, count=1)
                  else:
                      g += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              open(gg, "w", encoding="utf-8").write(g)
              print("  desugaring injected into build.gradle")
          else:
              raise SystemExit("ERROR: no android/app/build.gradle(.kts) after flutter create")

          print("ota_update Android requirements injected (idempotent).")
          PYEOF

      # Firebase needs two things the generated android/ tree does not have:
      # the google-services.json for this app, and the Google Services Gradle
      # plugin that turns it into Android resources. Without BOTH, the APK
      # builds fine and then dies on first launch with "Default FirebaseApp is
      # not initialized" -- on every user's phone, with nothing in CI to catch
      # it. The JSON lives in a secret rather than the repo because the repo is
      # public and android/ is gitignored (it is regenerated per build).
      - name: Inject Firebase (google-services.json + Gradle plugin)
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_SERVICES_JSON_B64:-}" || {
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret not set"
            exit 1
          }
          # The secret may hold the file itself or its base64 encoding --
          # both are things a person reasonably pastes into a secret box, and
          # guessing wrong costs a failed build, so detect instead of assume.
          FIRST_CHAR=$(printf '%s' "$GOOGLE_SERVICES_JSON_B64" | tr -d '[:space:]' | cut -c1)
          if [ "$FIRST_CHAR" = "{" ]; then
            echo "secret holds raw JSON"
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" > android/app/google-services.json
          else
            echo "secret holds base64"
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | tr -dc 'A-Za-z0-9+/=' > /tmp/gs.b64
            base64 -d /tmp/gs.b64 > android/app/google-services.json || {
              echo "::error::GOOGLE_SERVICES_JSON_BASE64 is neither valid base64 nor a JSON object"
              exit 1
            }
          fi
          test -s android/app/google-services.json || {
            echo "::error::decoding GOOGLE_SERVICES_JSON_BASE64 produced nothing"
            exit 1
          }

          # A JSON that parses but names a different package would produce a
          # silent no-op plugin and the same launch crash, so check the id.
          python3 - <<'PYEOF'
          import json
          import sys

          data = json.load(open("android/app/google-services.json", encoding="utf-8"))
          names = [
              client["client_info"]["android_client_info"]["package_name"]
              for client in data.get("client", [])
          ]
          if "com.example.mobile" not in names:
              sys.exit(
                  "::error::google-services.json has no client for "
                  "com.example.mobile (found: %s)" % names
              )
          print("google-services.json: client found for com.example.mobile")
          PYEOF

          python3 - <<'PYEOF'
          import os
          import re
          import sys

          # Verified on plugins.gradle.org / Firebase docs 2026-09-10:
          # com.google.gms.google-services 4.5.0 is current.
          PLUGIN_VERSION = "4.5.0"

          settings = "android/settings.gradle.kts"
          app = "android/app/build.gradle.kts"

          if not os.path.exists(settings) or not os.path.exists(app):
              sys.exit(
                  "::error::expected Kotlin-DSL Gradle files after flutter "
                  "create; found settings=%s app=%s"
                  % (os.path.exists(settings), os.path.exists(app))
              )

          s = open(settings, encoding="utf-8").read()
          if "com.google.gms.google-services" not in s:
              s, n = re.subn(
                  r'(\n\s*id\("com\.android\.application"\)[^\n]*\n)',
                  r'\1    id("com.google.gms.google-services") version "%s" apply false\n'
                  % PLUGIN_VERSION,
                  s,
                  count=1,
              )
              if n != 1:
                  sys.exit(
                      "::error::com.android.application not found in "
                      "settings.gradle.kts"
                  )
              open(settings, "w", encoding="utf-8").write(s)
              print("settings.gradle.kts: google-services %s declared" % PLUGIN_VERSION)
          else:
              print("settings.gradle.kts: already declared")

          g = open(app, encoding="utf-8").read()
          if "com.google.gms.google-services" not in g:
              # Applied after the Flutter/Android plugins: the plugin needs an
              # applicationId to resolve the client from the JSON.
              g, n = re.subn(
                  r'(\n\s*id\("dev\.flutter\.flutter-gradle-plugin"\)\n)',
                  r'\1    id("com.google.gms.google-services")\n',
                  g,
                  count=1,
              )
              if n != 1:
                  sys.exit(
                      "::error::dev.flutter.flutter-gradle-plugin not found in "
                      "app/build.gradle.kts"
                  )
              open(app, "w", encoding="utf-8").write(g)
              print("app/build.gradle.kts: google-services applied")
          else:
              print("app/build.gradle.kts: already applied")

          # Android 13+ refuses to show a notification without this runtime
          # permission; the app still has to request it, but it must be
          # declared here first.
          manifest = "android/app/src/main/AndroidManifest.xml"
          m = open(manifest, encoding="utf-8").read()
          if "POST_NOTIFICATIONS" not in m:
              m, n = re.subn(
                  r"(<manifest[^>]*>)",
                  r'\1\n    <uses-permission '
                  r'android:name="android.permission.POST_NOTIFICATIONS" />',
                  m,
                  count=1,
              )
              if n != 1:
                  sys.exit("::error::<manifest> not found in AndroidManifest.xml")
              open(manifest, "w", encoding="utf-8").write(m)
              print("AndroidManifest.xml: POST_NOTIFICATIONS declared")
          else:
              print("AndroidManifest.xml: POST_NOTIFICATIONS already declared")
          PYEOF

      - name: Restore committed web assets
        run: git checkout -- apps/mobile/web

      - name: Generate code (build_runner)
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (split-per-abi)
        working-directory: apps/mobile
        run: |
          CLEAN_API_BASE_URL=$(printf '%s' "$API_BASE_URL" | tr -d '\r\n')
          # Same 7 characters the release job uses for its `build-<sha>` tag,
          # so the installed app can recognise its own release URL and tell
          # whether it is the newest build.
          BUILD_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "{\"NUKHBA_API_BASE_URL\":\"$CLEAN_API_BASE_URL\",\"NUKHBA_BUILD_SHA\":\"$BUILD_SHA\"}" > /tmp/dart_defines.json
          flutter build apk --split-per-abi --dart-define-from-file=/tmp/dart_defines.json --release

      - name: Verify release signing (apksigner)
        working-directory: apps/mobile
        env:
          EXPECTED_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "${EXPECTED_SHA256:-}" || { echo "::error::ANDROID_CERT_SHA256 secret not set"; exit 1; }
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          AS="$BT/apksigner"
          test -x "$AS" || { echo "::error::apksigner not found under $BT"; exit 1; }
          EXP=$(echo "$EXPECTED_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          for apk in build/app/outputs/flutter-apk/*.apk; do
            "$AS" verify --print-certs "$apk"
            ACT=$("$AS" verify --print-certs "$apk" | grep 'certificate SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')
            [ "$ACT" = "$EXP" ] || { echo "::error::signature mismatch for $apk: got $ACT expected $EXP"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nukhba-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  publish_latest_apk:
    name: Publish latest APK to Release
    runs-on: ubuntu-latest
    needs: [build_android, database_migrations]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nukhba-android-apk
          path: apk

      - name: Rename per-ABI APKs, then build checksums.json (post-rename)
        run: |
          set -euo pipefail
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          cd apk
          python3 - "$SHORT_SHA" <<'PYEOF'
          import sys, os, re, hashlib, json, glob
          sha = sys.argv[1]
          # Flutter emits app-arm64-v8a-release.apk etc. Rename to
          # nukhbaa-<abi>-<sha>.apk. If a universal apk exists, tag it "universal".
          for f in glob.glob("*.apk"):
              m = re.search(r"(arm64-v8a|armeabi-v7a|x86_64|x86)", f)
              abi = m.group(1) if m else "universal"
              os.rename(f, "nukhbaa-%s-%s.apk" % (abi, sha))
          # Build checksums.json keyed by the FINAL published filenames.
          out = {}
          for f in sorted(glob.glob("nukhbaa-*.apk")):
              out[f] = hashlib.sha256(open(f, "rb").read()).hexdigest()
          json.dump(out, open("checksums.json", "w"), indent=2)
          print(json.dumps(out, indent=2))
          PYEOF

      - name: Publish an immutable per-build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.SHORT_SHA }}
          name: Build ${{ env.SHORT_SHA }}
          body: |
            بناء تلقائي من commit ${{ github.sha }}
          make_latest: true
          files: |
            apk/nukhbaa-*.apk
            apk/checksums.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_server_image:
    name: Build server Docker image
    runs-on: ubuntu-latest
    needs: workspace
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only. Not pushed anywhere yet: the point is to keep the
      # Dockerfile from rotting, and to catch the pub-workspace detachment
      # (resolution: workspace inside build/) at PR time instead of at
      # first deploy.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nukhba-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the compiled exe actually links against the runtime image's
      # glibc — the exact defect the debian->ubuntu base change fixes. The
      # server exits non-zero without DB config, which is expected and fine;
      # we only assert it is NOT a loader/glibc failure.
      - name: Smoke-check the binary loads
        run: |
          set -o pipefail
          out="$(docker run --rm --entrypoint /bin/sh nukhba-server:ci \
                 -c 'ldd /app/server' 2>&1)" || true
          echo "$out"
          if echo "$out" | grep -qi 'not found'; then
            echo "::error::Missing shared library in runtime image (glibc mismatch)."
            exit 1
          fi
