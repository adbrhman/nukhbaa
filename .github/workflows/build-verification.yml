name: Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-verification-${{ github.ref }}
  cancel-in-progress: true

env:
  API_BASE_URL: ${{ vars.NUKHBA_API_BASE_URL || 'https://api.nukhba.example' }}

jobs:
  workspace:
    name: Analyze + Test (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Generate code (build_runner, mobile)
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (workspace, fatal warnings)
        run: dart analyze --fatal-warnings .

      - name: Verify formatting (workspace)
        run: dart format --output=none --set-exit-if-changed .

      - name: Import-lint (Clean Architecture boundaries)
        run: dart run tooling/import_lint/bin/import_lint.dart

      - name: Test — Dart packages
        run: |
          set -e
          for p in packages/shared packages/domain packages/contracts \
                   packages/application packages/infrastructure \
                   tooling/import_lint apps/server; do
            echo "::group::dart test $p"
            (cd "$p" && dart test)
            echo "::endgroup::"
          done

      - name: Test — apps/mobile (flutter)
        working-directory: apps/mobile
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/mobile/coverage/lcov.info
          retention-days: 14

  build_web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: workspace
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Ensure platform folders exist
        working-directory: apps/mobile
        run: flutter create --platforms=web . --project-name mobile

      - name: Restore committed web assets
        run: git checkout -- apps/mobile/web

      - name: Generate code (build_runner)
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        working-directory: apps/mobile
        run: flutter build web --release --dart-define=NUKHBA_API_BASE_URL=${{ env.API_BASE_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: nukhba-web
          path: apps/mobile/build/web
          retention-days: 14

  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: workspace
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Read pinned Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Ensure platform folders exist
        working-directory: apps/mobile
        run: flutter create --platforms=android . --project-name mobile

      - name: Restore committed web assets
        run: git checkout -- apps/mobile/web

      - name: Generate code (build_runner)
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        working-directory: apps/mobile
        run: flutter build apk --release --dart-define=NUKHBA_API_BASE_URL=${{ env.API_BASE_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: nukhba-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
