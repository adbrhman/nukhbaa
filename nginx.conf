# The web mirror: the same Flutter web build GitHub Pages serves, under the
# same /nukhbaa/ path, so one build fits both hosts. See Dockerfile.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Northflank terminates TLS in front of this container, so a redirect
    # must stay relative; an absolute one would point at http://...:8080.
    absolute_redirect off;

    # The first visit downloads main.dart.js and canvaskit.wasm (about 10 MB
    # raw); compressed they are a fraction of that on a slow connection.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript
               application/json application/manifest+json application/wasm
               application/octet-stream image/svg+xml;

    location = / {
        return 302 /nukhbaa/;
    }

    # no-cache: the browser keeps its copy but asks every time whether it
    # changed (a 304 when it has not). The file names never change between
    # builds (main.dart.js, flutter_bootstrap.js), so a max-age kept serving
    # the previous build after a deploy.
    location /nukhbaa/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /nukhbaa/index.html;
    }
}
